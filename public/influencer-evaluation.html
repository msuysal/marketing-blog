
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap');
:root {
  --color-background-primary: #fdfdfb;
  --color-background-secondary: #f4f2ee;
  --color-text-primary: #1c1c1d;
  --color-text-secondary: #555;
  --color-text-tertiary: #888;
  --color-border-primary: #1c1c1d;
  --color-border-secondary: #d1d1d1;
  --color-border-tertiary: rgba(28, 28, 29, 0.1);
  --border-radius-md: 4px;
  --border-radius-lg: 8px;
  --font-sans: 'Sora', sans-serif;
  --accent: #e2c331;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--color-background-primary)}
.app{font-family:'Sora',var(--font-sans);padding:1.5rem 1rem;color:var(--color-text-primary);max-width:100%;margin:0 auto}
.app-header{margin-bottom:2rem}
.app-header h1{font-size:24px;font-weight:600;letter-spacing:-.5px;margin-bottom:6px;font-family:'Sora', serif;}
.tabs{display:flex;gap:0;margin-bottom:1.5rem;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);overflow:hidden;width:fit-content;flex-wrap:wrap}
.tb{padding:8px 18px;font-size:13px;font-weight:500;background:transparent;color:var(--color-text-secondary);cursor:pointer;border:none;font-family:'Sora',var(--font-sans);border-right:0.5px solid var(--color-border-tertiary);transition:all .15s}
.tb:last-child{border-right:none}
.tb:hover{background:var(--color-background-secondary)}
.tb.on{background:var(--accent);color:var(--color-text-primary)}
.panel{display:none}.panel.on{display:block}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.125rem 1.25rem;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:620px){.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr 1fr}}
.kpi{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.875rem 1rem;position:relative;overflow:hidden}
.kpi .k-val{font-size:20px;font-weight:600;letter-spacing:-.5px;margin-bottom:2px;font-family:'DM Mono',monospace}
.kpi .k-lbl{font-size:11px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em}
.kpi .k-sub{font-size:10px;color:var(--color-text-tertiary);margin-top:3px;font-family:'DM Mono',monospace}
.kpi .k-bar{position:absolute;bottom:0;left:0;height:3px;border-radius:0 2px 0 0;width:100%}
.k-green .k-val{color:#0F6E56}.k-green .k-bar{background:#1D9E75}
.k-blue .k-val{color:#185FA5}.k-blue .k-bar{background:#378ADD}
.k-amber .k-val{color:#854F0B}.k-amber .k-bar{background:#EF9F27}
.k-red .k-val{color:#A32D2D}.k-red .k-bar{background:#E24B4A}
.k-purple .k-val{color:#534AB7}.k-purple .k-bar{background:#7F77DD}
.k-teal .k-val{color:#0F6E56}.k-teal .k-bar{background:#5DCAA5}
.sec-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--color-text-secondary);margin-bottom:10px;font-family:'DM Mono',monospace}
.inf-tbl{width:100%;border-collapse:collapse;font-size:12px}
.inf-tbl th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-secondary);text-align:left;padding:8px 8px;border-bottom:0.5px solid var(--color-border-tertiary);white-space:nowrap;font-family:'DM Mono',monospace}
.inf-tbl td{padding:10px 8px;border-bottom:0.5px solid var(--color-border-tertiary);vertical-align:middle}
.inf-tbl tr:last-child td{border-bottom:none}
.inf-tbl tr:hover td{background:var(--color-background-secondary)}
.av{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;font-family:'DM Mono',monospace}
.pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;font-family:'DM Mono',monospace;white-space:nowrap}
.p-gr{background:#E1F5EE;color:#0F6E56}.p-bl{background:#E6F1FB;color:#185FA5}
.p-am{background:#FAEEDA;color:#854F0B}.p-rd{background:#FCEBEB;color:#A32D2D}
.p-dq{background:#F1EFE8;color:#444441;text-decoration:line-through}
.c-g{color:#0F6E56}.c-a{color:#854F0B}.c-r{color:#A32D2D}.c-b{color:#185FA5}.c-n{color:var(--color-text-secondary)}
.sc-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:10px}
.sc-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sc-name-in{font-size:14px;font-weight:600;border:none;background:transparent;color:var(--color-text-primary);font-family:'Sora',var(--font-sans);outline:none;flex:1;min-width:100px;border-bottom:0.5px dashed var(--color-border-secondary);padding-bottom:2px}
.cr-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
@media(max-width:560px){.cr-grid{grid-template-columns:1fr 1fr}}
.cr-cell label{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-secondary);display:block;margin-bottom:4px;font-family:'DM Mono',monospace}
.cr-cell select{width:100%;padding:5px 6px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:11px;font-family:'DM Mono',monospace}
.cf-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:0.5px solid var(--color-border-tertiary)}
.cf-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-secondary);font-family:'DM Mono',monospace}
.cf-btn{padding:3px 10px;font-size:11px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);cursor:pointer;font-family:'DM Mono',monospace;transition:all .1s}
.cf-btn.on{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary)}
.dq-lbl{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--color-text-secondary);cursor:pointer;font-family:'DM Mono',monospace}
.dq-lbl input{accent-color:#E24B4A}
.eng-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;margin-bottom:12px}
.eng-col{border-right:0.5px solid var(--color-border-tertiary)}
.eng-col:last-child{border-right:none}
.eng-hd{background:var(--color-background-secondary);padding:10px 12px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;gap:8px}
.eng-field{padding:6px 12px;border-bottom:0.5px solid var(--color-border-tertiary)}
.eng-field:last-child{border-bottom:none}
.eng-field label{font-size:9px;color:var(--color-text-tertiary);display:block;margin-bottom:2px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.04em}
.eng-field input{width:100%;background:transparent;border:none;color:var(--color-text-primary);font-size:13px;font-family:'DM Mono',monospace;outline:none;padding:1px 0}
.eng-field input:focus{background:var(--color-background-secondary);border-radius:3px;padding:1px 4px}
.eng-field .calc{font-size:13px;font-weight:500;font-family:'DM Mono',monospace}
.platform-btn{padding:4px 10px;font-size:11px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);cursor:pointer;font-family:'DM Mono',monospace;margin-right:4px;margin-bottom:4px;transition:all .1s}
.platform-btn.on{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary)}
.bm-box{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:8px 12px;margin-bottom:10px;font-size:11px;font-family:'DM Mono',monospace;color:var(--color-text-secondary);line-height:1.8}
.bm-box strong{color:var(--color-text-primary)}
.insight{display:flex;gap:10px;padding:10px 14px;border-radius:var(--border-radius-md);margin-bottom:8px;font-size:12px;line-height:1.6}
.insight.info{background:#E6F1FB;border-left:2px solid #378ADD;color:#0C447C}
.insight.warn{background:#FAEEDA;border-left:2px solid #EF9F27;color:#633806}
.insight.danger{background:#FCEBEB;border-left:2px solid #E24B4A;color:#501313}
.insight.good{background:#E1F5EE;border-left:2px solid #1D9E75;color:#04342C}
.insight-icon{font-size:14px;flex-shrink:0;margin-top:1px}
.w-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.w-row label{font-size:11px;color:var(--color-text-secondary);flex:1;font-family:'DM Mono',monospace}
.w-row input[type=range]{flex:2;accent-color:var(--color-text-primary)}
.w-val{font-size:11px;font-weight:600;min-width:32px;text-align:right;font-family:'DM Mono',monospace;color:var(--color-text-primary)}
.wt-badge{font-size:10px;padding:2px 8px;border-radius:4px;font-family:'DM Mono',monospace;margin-left:8px}
.wt-ok{background:#E1F5EE;color:#0F6E56}.wt-bad{background:#FCEBEB;color:#A32D2D}
.export-btn{padding:7px 18px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-primary);background:transparent;color:var(--color-text-primary);cursor:pointer;font-family:'DM Mono',monospace;transition:all .15s}
.export-btn:hover{background:var(--color-text-primary);color:var(--color-background-primary)}
.fi-sub{font-size:11px;border:none;background:transparent;color:var(--color-text-secondary);font-family:'DM Mono',monospace;outline:none;border-bottom:0.5px dashed var(--color-border-secondary);padding-bottom:1px}
.fi-sub::placeholder{color:var(--color-text-tertiary)}
@media(max-width:600px){.eng-grid{grid-template-columns:1fr}.eng-col{border-right:none;border-bottom:0.5px solid var(--color-border-tertiary)}.eng-col:last-child{border-bottom:none}}
</style>

<div class="app">
<div class="app-header">
  <h1>Authority Engine: Custom Benchmarking Model</h1>
</div>
<div class="tabs">
  <button class="tb on" onclick="go('overview')">Overview</button>
  <button class="tb" onclick="go('score')">Scoring</button>
  <button class="tb" onclick="go('engagement')">Engagement</button>
  <button class="tb" onclick="go('utm')">UTM & Sales</button>
  <button class="tb" onclick="go('results')">Results</button>
</div>

<div id="p-overview" class="panel on">
  <div class="g3" id="kpi-row" style="margin-bottom:12px"></div>
  <div style="display: flex; flex-direction: column; gap: 32px;">
    <div>
      <div class="sec-title">Influencer Profiles</div>
      <div style="overflow-x:auto; margin-bottom: 8px"><table class="inf-tbl" id="overview-tbl"></table></div>
    </div>
    <div>
      <div class="sec-title">Campaign Setup</div>
      <div class="card" style="padding:.875rem 1rem;margin-bottom:12px">
        <div class="g2" style="margin-bottom:12px">
          <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-secondary);margin-bottom:4px;font-family:'DM Mono',monospace">Budget (€)</div>
            <input type="number" id="budget" value="18000" style="width:100%;padding:5px 8px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:13px;font-family:'DM Mono',monospace" oninput="refresh()"></div>
          <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-secondary);margin-bottom:4px;font-family:'DM Mono',monospace">Target ROAS</div>
            <input type="number" id="t-roas" value="3" step="0.5" style="width:100%;padding:5px 8px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:13px;font-family:'DM Mono',monospace" oninput="refresh()"></div>
          <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-secondary);margin-bottom:4px;font-family:'DM Mono',monospace">Target CAC (€)</div>
            <input type="number" id="t-cac" value="28" style="width:100%;padding:5px 8px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:13px;font-family:'DM Mono',monospace" oninput="refresh()"></div>
          <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-secondary);margin-bottom:4px;font-family:'DM Mono',monospace">Avg Order (€)</div>
            <input type="number" id="aov" value="72" style="width:100%;padding:5px 8px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:13px;font-family:'DM Mono',monospace" oninput="refresh()"></div>
        </div>
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-secondary);margin-bottom:8px;font-family:'DM Mono',monospace">Criterion Weights <span id="wt-total" class="wt-badge wt-ok">100%</span></div>
        <div id="w-sliders"></div>
      </div>
      <div class="sec-title">Platform Benchmarks</div>
      <div class="bm-box" id="bm-box"></div>
    </div>
  </div>
</div>

<div id="p-score" class="panel"><div id="score-cards"></div></div>

<div id="p-engagement" class="panel">
  <div style="margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <span class="sec-title" style="margin-bottom:0">Platform:</span>
    <button class="platform-btn on" onclick="setPlatform(this,'ig_reel')">IG Reel</button>
    <button class="platform-btn" onclick="setPlatform(this,'ig_post')">IG Post</button>
    <button class="platform-btn" onclick="setPlatform(this,'ig_story')">IG Story</button>
    <button class="platform-btn" onclick="setPlatform(this,'tiktok')">TikTok</button>
    <button class="platform-btn" onclick="setPlatform(this,'yt_short')">YT Short</button>
  </div>
  <div class="eng-grid" id="eng-grid"></div>
  <div class="g3" id="eng-kpis" style="margin-bottom:12px"></div>
  <div class="sec-title">Engagement Insights</div>
  <div id="eng-insights"></div>
</div>

<div id="p-utm" class="panel">
  <div class="eng-grid" id="utm-grid"></div>
  <div class="g3" id="utm-kpis" style="margin-bottom:14px"></div>
  <div class="sec-title">Sales Insights</div>
  <div id="utm-insights"></div>
</div>

<div id="p-results" class="panel">
  <div class="g3" id="res-kpis" style="margin-bottom:14px"></div>
  <div class="sec-title">Final Ranking — Composite Score (Rubric 34% · Engagement 33% · Sales 33%)</div>
  <div style="overflow-x:auto"><table class="inf-tbl" id="results-tbl" style="margin-bottom:16px"></table></div>
  <button class="export-btn" onclick="exportCSV()">Export CSV</button>
</div>
</div>

<script>
const CRIT=[
  {id:'brand',label:'Brand Fit',icon:'🎯'},
  {id:'data', label:'Data Transparency',icon:'📊'},
  {id:'econ', label:'Economic Efficiency',icon:'💰'},
  {id:'cont', label:'Content Quality',icon:'✨'},
  {id:'auth', label:'Audience Auth.',icon:'👥'},
];
const DQS=['Bot >30%','Competitor deal','Legal/PR','Refused data','Cat. conflict'];
const SL={1:'Critical',2:'Weak',3:'Average',4:'Good',5:'Excellent'};
const CMULT={H:1.0,M:0.90,L:0.75};
const AVC=['#EEEDFE','#E1F5EE','#FAEEDA'];
const AVT=['#534AB7','#0F6E56','#854F0B'];
const PLATFORMS={
  ig_post: {label:'Instagram Post',  er_good:3.0,er_avg:1.5,save_good:1.0,share_good:0.5,view_based:false,swipe:false},
  ig_reel: {label:'Instagram Reel',  er_good:5.0,er_avg:3.0,save_good:2.0,share_good:1.5,view_based:true, swipe:false},
  ig_story:{label:'Instagram Story', er_good:8.0,er_avg:4.0,save_good:0,  share_good:0,  view_based:true, swipe:true},
  tiktok:  {label:'TikTok',          er_good:6.0,er_avg:3.0,save_good:1.5,share_good:2.0,view_based:true, swipe:false},
  yt_short:{label:'YouTube Short',   er_good:4.0,er_avg:2.0,save_good:0.5,share_good:1.0,view_based:true, swipe:false},
};
let currentPlatform='ig_reel';
let weights=[20,20,20,20,20];

// 3 realistic influencers: star performer, average, problematic
let infs=[
  {
    name:'Lena Kovač', handle:'@lenakovac', followers:'61K', niche:'Wellness & Lifestyle', fee:2200,
    scores:[5,5,4,5,4], conf:'H',
    dqs:[false,false,false,false,false],
    eng:{reach:48000,impressions:112000,likes:3840,comments:421,shares:890,saves:1540,views:61000,swipe_ups:0,comment_qual:5},
    utm:{clicks:3200,sessions:2750,orders:198,revenue:14256,returns:12,repeat:61}
  },
  {
    name:'Can Yıldız', handle:'@canyildiz', followers:'134K', niche:'Fashion & Lifestyle', fee:4800,
    scores:[3,3,3,4,3], conf:'M',
    dqs:[false,false,false,false,false],
    eng:{reach:89000,impressions:178000,likes:4450,comments:312,shares:620,saves:1780,views:105000,swipe_ups:0,comment_qual:3},
    utm:{clicks:5100,sessions:3980,orders:142,revenue:10224,returns:28,repeat:19}
  },
  {
    name:'Mert Aksoy', handle:'@mertaksoy', followers:'310K', niche:'Tech & Gaming', fee:7800,
    scores:[2,1,2,3,2], conf:'L',
    dqs:[false,false,false,true,false],
    eng:{reach:62000,impressions:95000,likes:1860,comments:189,shares:210,saves:310,views:88000,swipe_ups:0,comment_qual:2},
    utm:{clicks:4200,sessions:2900,orders:61,revenue:4392,returns:38,repeat:4}
  }
];

function ini(n){if(!n)return'?';return n.split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2)}
function isDQ(inf){return inf.dqs.some(d=>d)}
function hasEng(inf){return inf.eng.reach>0||inf.eng.views>0}
function hasUtm(inf){return inf.utm.orders>0}

function rubricScore(inf){
  const tot=weights.reduce((a,b)=>a+b,0)||1;
  let s=0;CRIT.forEach((_,j)=>s+=(weights[j]/tot)*inf.scores[j]);
  return +(s*CMULT[inf.conf]).toFixed(2);
}
function getER(inf){
  const p=PLATFORMS[currentPlatform];
  const base=p.view_based?(inf.eng.views||inf.eng.reach):inf.eng.reach;
  if(!base)return 0;
  return +(((inf.eng.likes+inf.eng.comments+inf.eng.saves+inf.eng.shares)/base)*100).toFixed(2);
}
function getSaveRate(inf){const b=inf.eng.reach||inf.eng.views;return b>0?+((inf.eng.saves/b)*100).toFixed(2):0}
function getShareRate(inf){const b=inf.eng.reach||inf.eng.views;return b>0?+((inf.eng.shares/b)*100).toFixed(2):0}
function getSwipeRate(inf){return inf.eng.views>0?+((inf.eng.swipe_ups/inf.eng.views)*100).toFixed(2):0}
function getImpRatio(inf){return inf.eng.reach>0?+(inf.eng.impressions/inf.eng.reach).toFixed(2):0}
function engScore(inf){
  if(!hasEng(inf))return null;
  const p=PLATFORMS[currentPlatform];
  const er=getER(inf);const sr=getSaveRate(inf);const shr=getShareRate(inf);
  const eS=Math.min(5,Math.max(1,+(er/p.er_good*3.5).toFixed(1)));
  const srS=p.save_good>0?Math.min(5,Math.max(1,+(sr/p.save_good*3.5).toFixed(1))):3;
  const shrS=p.share_good>0?Math.min(5,Math.max(1,+(shr/p.share_good*3.5).toFixed(1))):3;
  return +((eS+srS+shrS+inf.eng.comment_qual)/4).toFixed(2);
}
function getRoas(inf){return inf.fee>0&&inf.utm.revenue>0?+(inf.utm.revenue/inf.fee).toFixed(2):0}
function getCvr(inf){return inf.utm.sessions>0?+((inf.utm.orders/inf.utm.sessions)*100).toFixed(1):0}
function getCac(inf){return inf.utm.orders>0?+(inf.fee/inf.utm.orders).toFixed(0):0}
function getRR(inf){return inf.utm.orders>0?+((inf.utm.returns/inf.utm.orders)*100).toFixed(1):0}
function salesScore(inf){
  if(!hasUtm(inf))return null;
  const tR=+(document.getElementById('t-roas').value)||3;
  const tC=+(document.getElementById('t-cac').value)||28;
  const rS=Math.min(5,Math.max(1,+(getRoas(inf)/tR*2.5).toFixed(1)));
  const cS=Math.min(5,Math.max(1,+(tC/Math.max(getCac(inf),1)*2.5).toFixed(1)));
  const cvrS=Math.min(5,Math.max(1,+(getCvr(inf)/2).toFixed(1)));
  return +((rS+cS+cvrS)/3).toFixed(2);
}
function finalScore(inf){
  if(isDQ(inf))return{score:0,label:'DQ'};
  const r=rubricScore(inf),e=engScore(inf),s=salesScore(inf);
  if(!e&&!s)return{score:r,label:'Rubric only'};
  if(e&&!s)return{score:+(r*0.5+e*0.5).toFixed(2),label:'Rubric+Eng'};
  if(!e&&s)return{score:+(r*0.5+s*0.5).toFixed(2),label:'Rubric+Sales'};
  return{score:+(r*0.34+e*0.33+s*0.33).toFixed(2),label:'Composite'};
}

    <td style="font-family:'DM Mono',monospace;font-size:11px;color:${sr>0?(sr>=p.save_good?'#0F6E56':'#854F0B'):'var(--color-text-tertiary)'}">${sr>0?sr+'%':'—'}</td>
    <td style="font-family:'DM Mono',monospace;font-size:11px;font-weight:600;color:${es?colorS(es):'var(--color-text-tertiary)'}">${es||'—'}</td>
    <td style="font-family:'DM Mono',monospace;font-size:11px;color:${roas>0?(roas>=tR?'#0F6E56':roas>=tR*.6?'#854F0B':'#A32D2D'):'var(--color-text-tertiary)'}">${roas>0?roas+'x':'—'}</td>
    <td style="font-family:'DM Mono',monospace;font-size:11px;font-weight:600;color:${ss?colorS(ss):'var(--color-text-tertiary)'}">${ss||'—'}</td>
    <td><span class="pill ${dq?'p-dq':pillCls(fs.score)}">${dq?'DQ':fs.score}</span><br><span style="font-size:9px;color:var(--color-text-tertiary);font-family:'DM Mono',monospace">${fs.label}</span></td>
    </tr>`;
  }).join('')}</tbody>`;

  const valid=infs.filter(i=>!isDQ(i));
  const top=valid.sort((a,b)=>finalScore(b).score-finalScore(a).score)[0];
  const totRev=infs.reduce((a,b)=>a+b.utm.revenue,0);const totFee=infs.reduce((a,b)=>a+b.fee,0);
  const rk=document.getElementById('res-kpis');if(rk)
  rk.innerHTML=[
    {v:top?top.name.split(' ')[0]:'—',l:'Top Performer',s:'Score: '+finalScore(top).score,c:'k-green'},
    {v:'€'+totRev.toLocaleString(),l:'Total Revenue',s:'on €'+totFee.toLocaleString()+' spend',c:'k-green'},
    {v:totFee>0&&totRev>0?(totRev/totFee).toFixed(2)+'x':'—',l:'Blended ROAS',s:'target: '+((+(document.getElementById('t-roas').value)||3))+'x',c:'k-amber'},
  ].map(k=>`<div class="kpi ${k.c}"><div class="k-val">${k.v}</div><div class="k-lbl">${k.l}</div><div class="k-sub">${k.s}</div><div class="k-bar"></div></div>`).join('');
}

function refresh(){
  renderKPIs();renderOverviewTable();
  if(document.getElementById('p-score').classList.contains('on'))renderScoring();
  if(document.getElementById('p-engagement').classList.contains('on'))renderEngagement();
  if(document.getElementById('p-utm').classList.contains('on'))renderUTM();
  if(document.getElementById('p-results').classList.contains('on'))renderResults();
}
function go(tab){
  ['overview','score','engagement','utm','results'].forEach(t=>{document.getElementById('p-'+t).classList.toggle('on',t===tab)});
  document.querySelectorAll('.tb').forEach((b,i)=>b.classList.toggle('on',['overview','score','engagement','utm','results'][i]===tab));
  if(tab==='score')renderScoring();
  if(tab==='engagement')renderEngagement();
  if(tab==='utm')renderUTM();
  if(tab==='results')renderResults();
}
function exportCSV(){
  const rows=[['Name','Handle','Niche','Followers','Fee',...CRIT.map(c=>c.label),'Confidence','Rubric','ER%','Save%','Share%','Eng.Score','ROAS','CVR%','CAC','Return%','Sales Score','Final Score','Method','DQ']];
  infs.forEach(inf=>rows.push([inf.name,inf.handle,inf.niche,inf.followers,inf.fee,...inf.scores,inf.conf,rubricScore(inf),getER(inf)||'—',getSaveRate(inf)||'—',getShareRate(inf)||'—',engScore(inf)||'—',getRoas(inf)||'—',getCvr(inf)||'—',getCac(inf)||'—',getRR(inf)||'—',salesScore(inf)||'—',finalScore(inf).score,finalScore(inf).label,isDQ(inf)?'YES':'NO']));
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(rows.map(r=>r.join(',')).join('\n'));
  a.download='influencer_eval_filled.csv';a.click();
}
renderWeights();renderKPIs();renderOverviewTable();renderBenchmarks();
</script>
